# Codemagic（クラウドの Mac）で iOS アプリ「TimyCue」をビルドし、TestFlight へ送る設定。
# Mac がなくても、Windows のブラウザから Codemagic と App Store Connect を操作するだけで進められる。
# 手順と、Apple 側で用意するものは docs/ios-release.md を参照。
#
# Xcode プロジェクトは Git に入れず、project.yml から XcodeGen で毎回作る。
# どちらのワークフローも、Codemagic の画面から手動で始める（push のたびにビルド時間を使わないように）。

workflows:
  # ---- 1. 署名なしでシミュレータ向けにビルドし、自動テストを流して、画面写真を撮る ----
  # Apple Developer Program の登録や署名の準備が済む前から使える
  ios-check:
    name: iOS ビルド確認（署名なし）
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: latest
    scripts:
      - name: XcodeGen を入れて Xcode プロジェクトを作る
        script: |
          brew install xcodegen
          xcodegen generate
      - name: シミュレータを選ぶ（いちばん新しい iOS の Pro Max）
        script: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          found = [d for runtime, items in sorted(devices.items()) if "iOS" in runtime for d in items if "Pro Max" in d["name"]]
          print(found[-1]["udid"] if found else "")
          ')
          if [ -z "$UDID" ]; then
            echo "Pro Max のシミュレータが見つかりませんでした"
            xcrun simctl list devices available
            exit 1
          fi
          echo "シミュレータ: $UDID"
          echo "SIM_UDID=$UDID" >> "$CM_ENV"
      - name: 自動テスト（シミュレータ）
        # TIMYCUE_DEV_TOOLS：検証用のビルドの印。H1 の比べる画面（設定 ＞ 開発用：キャラクターの大きさ）を入れる（2026-10-15 決定 Q80）。
        # 印を付けたビルドは App Store の審査に出さない。H1 で大きさが決まったら、比べる画面と一緒にこの印を取り除く
        script: |
          set -o pipefail
          mkdir -p build
          xcodebuild test \
            -project TimyCue.xcodeproj \
            -scheme TimyCue \
            -configuration Debug \
            -destination "id=$SIM_UDID" \
            -derivedDataPath build/derived \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) TIMYCUE_DEV_TOOLS' \
            | tee build/test.log
      - name: 画面写真を撮る（見本の予定だけが入った状態）
        script: |
          set -e
          APP=build/derived/Build/Products/Debug-iphonesimulator/TimyCue.app
          BUNDLE=io.github.takejiyuuri.timycue
          mkdir -p build/screenshots build/diagnostics
          xcrun simctl boot "$SIM_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$SIM_UDID" -b
          xcrun simctl status_bar "$SIM_UDID" override --time "9:41" --batteryState charged --batteryLevel 100 || true
          xcrun simctl install "$SIM_UDID" "$APP"
          # アプリは、起動引数 -TimyCueScreenshot YES のとき、最初の画面を出したら書類のフォルダに印のファイルを書く（DEBUG のときだけ）。
          # 印が出るまで待ってから撮る。シミュレータでは起動画面が数十秒残ることがあり、決まった秒数だけ待つ撮り方では撮り損ねた（#36・#39・#43）
          DATA=$(xcrun simctl get_app_container "$SIM_UDID" "$BUNDLE" data)
          READY="$DATA/Documents/timycue-screenshot-ready"
          # 印が出てから、画面の切り替え（吹き出し・画面の押し込み）が落ち着くまでの秒数
          SETTLE=4
          launch_and_wait() {   # 起動の引数を渡して開き、最初の画面が出るまで待つ（最長 90 秒。待った秒数は WAITED）
            rm -f "$READY"
            xcrun simctl launch --terminate-running-process "$SIM_UDID" "$BUNDLE" -TimyCueScreenshot YES "$@" >/dev/null
            WAITED=0
            while [ ! -f "$READY" ] && [ "$WAITED" -lt 90 ]; do
              sleep 1
              WAITED=$((WAITED + 1))
            done
          }
          # 写真が起動画面のままかを、上の帯の明るさのばらつきで見分ける（起動画面は約 12、中身のある画面は 24 以上）。
          # アプリが最初の画面を出していても、シミュレータの画面が起動画面のまま残ることがある（#44）。見分けられないとき（Pillow を入れられない）は撮り直さない
          python3 -m pip install --quiet --disable-pip-version-check pillow >/dev/null 2>&1 || true
          cat > /tmp/is_launch_screen.py <<'PY'
          import sys
          from PIL import Image, ImageStat
          image = Image.open(sys.argv[1]).convert("L")
          width, height = image.size
          band = image.crop((0, int(height * 0.05), width, int(height * 0.35)))
          sys.exit(0 if ImageStat.Stat(band).stddev[0] < 18 else 1)
          PY
          is_launch_screen() { python3 /tmp/is_launch_screen.py "$1" 2>/dev/null; }
          capture() {   # $1 = 画面写真の名前、残りは起動の引数。起動画面のままなら、開き直して 3 回まで撮り直す
            NAME=$1
            shift
            for TRY in 1 2 3; do
              launch_and_wait "$@"
              sleep "$SETTLE"
              xcrun simctl io "$SIM_UDID" screenshot "build/screenshots/$NAME.png" >/dev/null
              if ! is_launch_screen "build/screenshots/$NAME.png"; then break; fi
              echo "$NAME：起動画面のままだったので、開き直して撮り直す（${TRY} 回目）"
              sleep 5
            done
            echo "$NAME：最初の画面が出るまで約 ${WAITED} 秒"
          }
          # 入れた直後に一度開いておく（初めの起動は特に遅い）
          launch_and_wait -TimyCueTab home
          echo "入れた直後に開いて、最初の画面が出るまで：約 ${WAITED} 秒"
          # 起動の記録（決まった秒数で撮ったもの。起動から 1・3・6・10・15 秒後）
          xcrun simctl launch --terminate-running-process "$SIM_UDID" "$BUNDLE" -TimyCueTab home >/dev/null
          ELAPSED=0
          for AT in 1 3 6 10 15; do
            sleep $((AT - ELAPSED))
            ELAPSED=$AT
            xcrun simctl io "$SIM_UDID" screenshot "build/diagnostics/launch-${AT}s.png" >/dev/null
          done
          for TAB in home calendar settings; do
            capture "$TAB" -TimyCueTab "$TAB"
          done
          # 月カレンダーで吹き出しを 2 つ開いた画面（今日と、見本で 13 件入れた 4 日後）
          capture calendar-popovers -TimyCueTab calendar -TimyCueOpenDays "0,4"
          # 今日の 1 日タイムライン（重なる予定の横分け・終日専用帯・現在時刻の線）
          capture timeline -TimyCueTab calendar -TimyCueTimelineDay 0
          # 予定詳細（今日の最初の時間指定の予定）
          capture event-detail -TimyCueTab calendar -TimyCueDetailOfFirstEventToday YES
          # 3 分割の予定編集（新規。今日・1 週後・2 週後を選んだ状態）
          capture editor -TimyCueEditorDays "0,7,14"
          # S1a（spec §89.4・§89.9）：保存先が使えないとき。見本のカレンダーを作成画面に渡すだけで、Apple カレンダーにはつながず何も書かない。
          # iPhone の既定（Default）の表示を OFF・表示のみにして保存を押すと、閉じずに理由のアラートが出る。カレンダーの行は「使えません」と選べる候補だけ
          capture editor-save-hidden -TimyCueEditorDays "0" -TimyCueSampleCalendars hiddenDefault -TimyCueEditorAutoSave YES
          capture editor-save-display-only -TimyCueEditorDays "0" -TimyCueSampleCalendars displayOnlyDefault -TimyCueEditorAutoSave YES
          capture editor-calendar-unavailable -TimyCueEditorDays "0" -TimyCueSampleCalendars hiddenDefault -TimyCueEditorRow calendar
          # H1 の比べる画面（設定 ＞ 開発用：キャラクターの案）で、正式キャラクター 3 モードを「いま」の直上の定位置に（2026-10-17。§88.3・Q87・Q88）。
          # 人型 36pt・時計 40％。名前は layout-モード-時計-見本の時刻-予定の数。overdue は 9:18（出発 9:15 を 3 分過ぎ。時計は終わっているので noclock。過ぎた出発の点が人型と「いま」のあいだ）
          for SHOT in "human YES before usual" "turtle YES before usual" "rabbit YES before usual" "human NO before usual" \
                      "rabbit NO overdue usual" "human YES before few" "human YES before many" "human NO before many"; do
            set -- $SHOT
            if [ "$2" = YES ]; then CLOCK=clock40; else CLOCK=noclock; fi
            capture "layout-$1-$CLOCK-$3-$4" -TimyCueTab settings -TimyCueDevScreen characterDesigns -TimyCueCharacterDesign official3 \
              -TimyCueCharacterMode "$1" -TimyCueCharacterClock "$2" -TimyCueDevScenario "$3" -TimyCueDevEvents "$4"
          done
          # H2 の前提作業 1（2026-10-16）：正式キャラクター 3 モードの立ち姿（設定 ＞ 開発用：キャラクター 3 モード）。
          # 上に 3 モードを本体 36pt で並べ、下に選んだモードを 108pt で。続けて 36pt のうさぎで、本体と耳を含めた枠を点線で出す
          for MODE in turtle human rabbit; do
            capture "modes-$MODE" -TimyCueTab settings -TimyCueDevScreen characterModes -TimyCueCharacterMode "$MODE" \
              -TimyCueCharacterModeHeight 108
          done
          capture modes-area-36 -TimyCueTab settings -TimyCueDevScreen characterModes -TimyCueCharacterMode rabbit \
            -TimyCueCharacterModeHeight 36 -TimyCueCharacterModeArea YES
          # 甲羅は見る人から見て左（2026-10-17）。36pt の亀で、本体の枠と、左へはみ出す甲羅を含めた枠を点線で出す
          capture modes-area-36-turtle -TimyCueTab settings -TimyCueDevScreen characterModes -TimyCueCharacterMode turtle \
            -TimyCueCharacterModeHeight 36 -TimyCueCharacterModeArea YES
          # H2 の前提作業 2（2026-10-16）：時計の確かめ（設定 ＞ 開発用：時計の確かめ。時計 40％）。数える先からの分は m＝前・p＝後
          for SHOT in "withPlace m61" "withPlace m60" "withPlace m23" "withPlace m1" "withPlace 0" "withPlace p3" \
                      "withoutPlace m23" "withoutPlace 0"; do
            set -- $SHOT
            capture "clock-$1-$2" -TimyCueTab settings -TimyCueDevScreen clockCheck -TimyCueClockScenario "$1" -TimyCueClockOffset "$2"
          done
          # Q94 の足りない状態（2026-10-17 許可）：「いま」の文字の出し入れ（55・54・6・5 分前）、弧の色の境目（31・30・15 分前）、
          # 出発の 2 分後（まだ出発してください）、場所ありの開始 10:30（予定時刻になりました）、場所なしの 61 分前と 3 分後（知らせが終わる）
          for SHOT in "withPlace m55" "withPlace m54" "withPlace m31" "withPlace m30" "withPlace m15" "withPlace m6" "withPlace m5" \
                      "withPlace p2" "withPlace p30" "withoutPlace m61" "withoutPlace p3"; do
            set -- $SHOT
            capture "clock-$1-$2" -TimyCueTab settings -TimyCueDevScreen clockCheck -TimyCueClockScenario "$1" -TimyCueClockOffset "$2"
          done
          # 小さい iPhone 相当の幅（375pt）でも撮る（2026-10-17 許可）。画面の大きさの確かめで、実機の確認ではない。
          # iOS 17 以上で幅がいちばん狭いのは 375pt（iPhone SE 第 3 世代・mini）。用意されていなければ SE（第 3 世代）を作る。作れなければ撮らない
          SMALL_UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for name in ["iPhone SE (3rd generation)", "iPhone 13 mini", "iPhone 12 mini"]:
              found = [d for runtime, items in sorted(devices.items()) if "iOS" in runtime for d in items if d["name"] == name]
              if found:
                  print(found[-1]["udid"])
                  break
          ') || true
          if [ -z "$SMALL_UDID" ]; then
            RUNTIME=$(xcrun simctl list runtimes available -j | python3 -c '
          import json, sys
          runtimes = [r for r in json.load(sys.stdin)["runtimes"] if r.get("platform") == "iOS" or "iOS" in r.get("name", "")]
          print(runtimes[-1]["identifier"] if runtimes else "")
          ') || true
            if [ -n "$RUNTIME" ]; then
              SMALL_UDID=$(xcrun simctl create "TimyCue SE" com.apple.CoreSimulator.SimDeviceType.iPhone-SE-3rd-generation "$RUNTIME" 2>/dev/null || true)
            fi
          fi
          # 小さい機種の写真は、うまくいかなくてもビルド確認を止めない（set +e の中で撮る）
          if [ -n "$SMALL_UDID" ]; then (
            set +e
            echo "小さい iPhone のシミュレータ: $SMALL_UDID"
            xcrun simctl shutdown "$SIM_UDID" 2>/dev/null || true
            SIM_UDID=$SMALL_UDID
            xcrun simctl boot "$SIM_UDID" 2>/dev/null || true
            xcrun simctl bootstatus "$SIM_UDID" -b
            xcrun simctl status_bar "$SIM_UDID" override --time "9:41" --batteryState charged --batteryLevel 100 || true
            # アプリを入れられなかったら、まちがった写真を撮らずに抜ける（サブシェルの exit は外を止めない）
            xcrun simctl install "$SIM_UDID" "$APP" || exit 0
            DATA=$(xcrun simctl get_app_container "$SIM_UDID" "$BUNDLE" data) || exit 0
            [ -n "$DATA" ] || exit 0
            READY="$DATA/Documents/timycue-screenshot-ready"
            launch_and_wait -TimyCueTab home
            # 時計 40％の中央の文字 4 種類と、出発 3 分超過の知らせ
            for SHOT in "withPlace m60" "withPlace m23" "withPlace m1" "withoutPlace m23" "withPlace p3"; do
              set -- $SHOT
              capture "small-clock-$1-$2" -TimyCueTab settings -TimyCueDevScreen clockCheck -TimyCueClockScenario "$1" -TimyCueClockOffset "$2"
            done
            # 人型の定位置（時計あり・なし、出発を過ぎた、予定が多い）
            for SHOT in "human YES before usual" "turtle YES before usual" "human NO before usual" "rabbit NO overdue usual" \
                        "human YES before many"; do
              set -- $SHOT
              if [ "$2" = YES ]; then CLOCK=clock40; else CLOCK=noclock; fi
              capture "small-layout-$1-$CLOCK-$3-$4" -TimyCueTab settings -TimyCueDevScreen characterDesigns -TimyCueCharacterDesign official3 \
                -TimyCueCharacterMode "$1" -TimyCueCharacterClock "$2" -TimyCueDevScenario "$3" -TimyCueDevEvents "$4"
            done
          ) || true
          else
            echo "小さい iPhone のシミュレータを用意できなかったので、小さい幅の画面写真は撮らない"
          fi
          ls -l build/screenshots
    artifacts:
      - build/screenshots/*.png
      - build/diagnostics/*.png
      - build/test.log
      - build/derived/Logs/**/*.xcactivitylog

  # ---- 2. 署名して ipa を作り、App Store Connect（TestFlight）へ送る ----
  ios-testflight:
    name: iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      # Codemagic の Team settings → Integrations → Developer Portal に登録した
      # App Store Connect API キーの名前（JWWミテハカールと同じキーを使う）
      app_store_connect: codemagic-asc
    environment:
      ios_signing:
        # Codemagic の Code signing identities に、配布用の証明書と App Store 用のプロファイルを用意しておく
        distribution_type: app_store
        bundle_identifier: io.github.takejiyuuri.timycue
      vars:
        XCODE_PROJECT: TimyCue.xcodeproj
        XCODE_SCHEME: TimyCue
        # App Store Connect の「App 情報」に出るアプリの Apple ID（数字）。
        # TestFlight に最初の 1 本が届いたあとで、次の行の先頭の # を消して数字を入れる。
        # これがあると、TestFlight にある最新のビルド番号の次を使う（無いと Codemagic の通し番号を使う）。
        # 空の値 "" は書けない（Codemagic が設定の誤りとして止める）ので、使わないときは # を付けたままにする
        APP_STORE_APPLE_ID: "6821819934"
      xcode: latest
    scripts:
      - name: XcodeGen を入れて Xcode プロジェクトを作る
        script: |
          brew install xcodegen
          xcodegen generate
      - name: 署名の設定を Xcode プロジェクトに入れる
        script: xcode-project use-profiles
      - name: ビルド番号を決める
        script: |
          NEXT=${BUILD_NUMBER:-1}
          if [ -n "$APP_STORE_APPLE_ID" ]; then
            # 取れないまま進めると、TestFlight にある番号以下でビルドしてから送信で断られるので、ここで止める
            if ! LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID"); then
              echo "TestFlight の最新のビルド番号を取れませんでした。App Store Connect の API キー（codemagic-asc）と APP_STORE_APPLE_ID を確かめてください。"
              exit 1
            fi
            case "$LATEST" in
              ''|*[!0-9]*)
                echo "TestFlight の最新のビルド番号が数ではありません: $LATEST"
                exit 1
                ;;
            esac
            if [ $((LATEST + 1)) -gt "$NEXT" ]; then NEXT=$((LATEST + 1)); fi
          fi
          echo "ビルド番号: $NEXT"
          echo "IOS_BUILD_NUMBER=$NEXT" >> "$CM_ENV"
      - name: ipa を作る
        # TIMYCUE_DEV_TOOLS：検証用のビルドの印（H1 の比べる画面を入れる。2026-10-15 決定 Q80）。Release には前からの条件がないので、そのまま置く。
        # 印を付けたビルドは App Store の審査に出さない（TestFlight と App Store で同じバイナリを使えるので、公開版は印のないビルドで作る）。
        # H1 で大きさが決まったら、比べる画面と一緒にこの印を取り除く
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-xcargs "COMPILER_INDEX_STORE_ENABLE=NO CURRENT_PROJECT_VERSION=$IOS_BUILD_NUMBER SWIFT_ACTIVE_COMPILATION_CONDITIONS=TIMYCUE_DEV_TOOLS"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # 社内テスター（App Store Connect のユーザ）は、内部テストのグループで「自動配信」をオンにしておけば
        # 処理が済み次第 TestFlight で入れられる。社外のテスターに配るときだけ true にする（毎回 Beta App Review がある）
        submit_to_testflight: false
