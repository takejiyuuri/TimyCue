# XcodeGen の設定。Mac がないので Xcode プロジェクト（TimyCue.xcodeproj）は Git に入れず、
# Codemagic のクラウドの Mac で `xcodegen generate` を実行して毎回ここから作る。
# 手順は docs/ios-release.md を参照。
name: TimyCue
options:
  bundleIdPrefix: io.github.takejiyuuri
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ja
  createIntermediateGroups: true

settings:
  base:
    # App Store に出る版番号。新しい版を出すときはここを上げる
    MARKETING_VERSION: "1.0"
    # ビルド番号は Codemagic が自動で決めて上書きする
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"

targets:
  TimyCue:
    type: application
    platform: iOS
    sources:
      - path: TimyCue
        excludes:
          - Info.plist
          - Resources/PrivacyInfo.xcprivacy
      # プライバシーマニフェスト：追跡なし・収集なし（App Store の提出に必要）
      - path: TimyCue/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: TimyCue/Info.plist
      properties:
        CFBundleDisplayName: TimyCue
        CFBundleDevelopmentRegion: ja
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # 許可の説明文。許可は必要になった時に初めて求める（仕様 §79）。位置情報・通知・モーションは使う段階で足す
        NSCalendarsFullAccessUsageDescription: Apple カレンダーの予定を TimyCue に表示し、TimyCue で作った予定を Apple カレンダーに保存するために使います。
        NSCalendarsUsageDescription: Apple カレンダーの予定を TimyCue に表示し、TimyCue で作った予定を Apple カレンダーに保存するために使います。
        # 位置情報は、出発が近づいて現在地からの計算を始めるときに初めて求める（追加仕様書 §25.1）。文言は 2026-10-14 決定
        NSLocationWhenInUseUsageDescription: 現在地から目的地までの移動時間を計算し、適切な出発時刻と到着見込みを案内するために位置情報を使用します。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.takejiyuuri.timycue
        # v1 は iPhone のみ（仕様 §2）
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic

  TimyCueTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TimyCueTests
    dependencies:
      - target: TimyCue
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.takejiyuuri.timycue.tests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  TimyCue:
    build:
      targets:
        TimyCue: all
        TimyCueTests: [test]
    test:
      config: Debug
      targets:
        - TimyCueTests
    run:
      config: Debug
    archive:
      config: Release
